per_listener_settings true
listener 8883 127.0.0.1
protocol mqtt
allow_anonymous false
require_certificate true
use_identity_as_username true
cafile   <repo>/out/broker/ca.crt
certfile <repo>/out/broker/broker.crt
keyfile  <repo>/out/broker/broker.key
acl_file <repo>/out/broker/acl
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
